[package]
name = "adrama"
version = "0.1.0"
edition = "2021"
description = "AI short-drama production workflow (CLI + GUI)"
license = "MIT"
repository = "https://github.com/hellomrli/my-adrama"
homepage = "https://github.com/hellomrli/my-adrama"
readme = "README.md"
keywords = ["ai", "video", "drama", "workflow", "gui"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
